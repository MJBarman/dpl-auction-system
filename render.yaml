# One-click deploy on Render (https://render.com) — a host that supports
# long-running Node servers, WebSockets and a writable disk, which this
# auction system needs (Vercel's serverless platform does not).
#
# In the Render dashboard: New + → Blueprint → pick this GitHub repo.
services:
  - type: web
    name: dpl-auction
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set your own 6-digit admin PIN in the Render dashboard when prompted.
      # Without it a random PIN is generated whenever the database starts fresh.
      - key: ADMIN_PIN
        sync: false
      # Supabase Storage for player photos (README → "Player photos").
      # Leave blank to run without photos — everything else still works.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # SQLite lives on the persistent disk below — NOT the ephemeral
      # filesystem, which Render wipes on every deploy/restart/spin-down.
      - key: DATA_DIR
        value: /var/data
    # Persistent disk (Starter plan) — keeps the auction database (players,
    # photos, bids, results) alive across deploys and restarts. Note: only
    # /var/data persists; the rest of the filesystem stays ephemeral.
    disk:
      name: auction-data
      mountPath: /var/data
      sizeGB: 1
